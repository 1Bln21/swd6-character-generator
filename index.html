<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Wars D6 – Character Generator (2nd Edition)</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
</head>
<body>

<header id="topbar" class="no-print">
  <div class="title-block">
    <h1>STAR WARS <span>D6</span></h1>
    <div class="subtitle" data-i18n="subtitle">Charaktergenerator &middot; 2nd Edition (Revised &amp; Expanded)</div>
    <nav class="page-nav">
      <a href="index.html" class="active" data-i18n="nav_char">Charaktere</a>
      <a href="droid.html" data-i18n="nav_droid">Droiden</a>
      <a href="ship.html" data-i18n="nav_ship">Schiffe / Fahrzeuge</a>
      <a href="npc.html" data-i18n="nav_npc">NPCs</a>
      <a href="dice.html" data-i18n="nav_dice">Würfeln</a>
      <a href="vtt.html" data-i18n="nav_vtt">Spieltisch</a>
    </nav>
  </div>
  <div class="char-manager">
    <select id="savedCharSelect"></select>
    <button id="btnLoad" data-i18n="btn_load">Laden</button>
    <button id="btnSave" class="accent" data-i18n="btn_save">💾 Speichern</button>
    <button id="btnNew" data-i18n="btn_new">Neu</button>
    <button id="btnDelete" title="Löschen">🗑</button>
    <span class="sep"></span>
    <button id="btnExport" data-i18n="btn_export">⬇ Export</button>
    <button id="btnImport" data-i18n="btn_import">⬆ Import</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <span class="sep"></span>
    <button id="btnPrint" class="accent" data-i18n="btn_print">🖨 Drucken / PDF</button>
    <button id="btnPdf" data-i18n="btn_pdf">📄 PDF</button>
    <span class="sep"></span>
    <button id="btnOnline">☁ Login / Register</button>
    <span class="sep"></span>
    <div class="options-wrap">
      <button id="btnOptions" title="Options / Optionen">⚙</button>
      <div id="optionsMenu" class="hidden">
        <div class="opt-title" data-i18n="options">Options</div>
        <div class="opt-section" data-i18n="opt_language">Sprache / Language</div>
        <label class="opt-row"><input type="radio" name="langOpt" value="de"> 🇩🇪 Deutsch</label>
        <label class="opt-row"><input type="radio" name="langOpt" value="en"> 🇺🇸 English</label>
        <div class="opt-section" data-i18n="opt_theme">Theme</div>
        <label class="opt-row"><input type="radio" name="themeOpt" value="dark"> <span data-i18n="theme_dark">Dark</span></label>
        <label class="opt-row"><input type="radio" name="themeOpt" value="light"> <span data-i18n="theme_light">Hell</span></label>
        <label class="opt-row"><input type="radio" name="themeOpt" value="oled"> <span data-i18n="theme_oled">OLED-Schwarz</span></label>
        <label class="opt-row"><input type="radio" name="themeOpt" value="bespin"> <span data-i18n="theme_bespin">Bespin</span></label>
        <div id="legalConfig"></div>
        <div class="opt-section" data-i18n="opt_about">Info</div>
        <button id="btnHelp" class="opt-btn" data-i18n="help_open">❓ Help</button>
        <button id="btnAbout" class="opt-btn" data-i18n="about_open">ℹ About &amp; Credits</button>
        <button id="btnAdmin" class="opt-btn hidden" data-i18n="online_admin">Administration</button>
      </div>
    </div>
  </div>
</header>

<nav id="tabs" class="no-print">
  <button data-tab="info" class="active" data-i18n="tab_info">Charakter</button>
  <button data-tab="attrs" data-i18n="tab_attrs">Attribute</button>
  <button data-tab="skills" data-i18n="tab_skills">Fertigkeiten</button>
  <button data-tab="force" data-i18n="tab_force">Die Macht</button>
  <button data-tab="equip" data-i18n="tab_equip">Ausrüstung</button>
  <button data-tab="weapons" data-i18n="tab_weapons">Waffen</button>
  <button data-tab="armor" data-i18n="tab_armor">Rüstung</button>
  <button data-tab="credits" data-i18n="tab_credits">Credits</button>
  <button data-tab="sheet" data-i18n="tab_sheet">Charakterbogen</button>
</nav>

<main id="content" class="no-print">
  <section id="tab-info" class="tab active"></section>
  <section id="tab-attrs" class="tab"></section>
  <section id="tab-skills" class="tab"></section>
  <section id="tab-force" class="tab"></section>
  <section id="tab-equip" class="tab"></section>
  <section id="tab-weapons" class="tab"></section>
  <section id="tab-armor" class="tab"></section>
  <section id="tab-credits" class="tab"></section>
  <section id="tab-sheet" class="tab"></section>
</main>

<div id="sheet-print"></div>

<footer class="no-print">
  <div class="gf-badge">
    <a href="https://www.groupfinder.gg/library/star-wars-d6-character-generator"
       target="_blank" rel="noopener noreferrer">
      <img src="gf-badge.svg" alt="Groupfinder" width="164" height="45">
    </a>
  </div>
  <span data-i18n="footer">Basiert auf „Character Generator v2-5“ (Excel) &middot; Star Wars: The Roleplaying Game, 2nd Edition – West End Games D6-System</span><span id="legalLinks"></span>
</footer>

<script src="data.js"></script>
<script src="pdfdata-gear.js"></script>
<script src="pdfdata-species.js"></script>
<script src="config.js"></script>
<script src="skills-de.js"></script>
<script src="app.js"></script>
<script src="help.js"></script>
<script src="credits.js"></script>
<script src="qrcode.js"></script>
<script src="jspdf.min.js"></script>
<script src="html2canvas.min.js"></script>
<script src="pdf-export.js"></script>
<script src="online.js"></script>
<script src="legal.js"></script>
<script src="arcade.js"></script>
</body>
</html>
