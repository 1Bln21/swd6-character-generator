<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Wars D6 – Ship &amp; Vehicle Generator</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
</head>
<body>

<header id="topbar" class="no-print">
  <div class="title-block">
    <h1>STAR WARS <span>D6</span></h1>
    <div class="subtitle" data-i18n="subtitle">Schiffs- und Fahrzeug-Generator</div>
    <nav class="page-nav">
      <a href="index.html" data-i18n="nav_char">Charaktere</a>
      <a href="droid.html" data-i18n="nav_droid">Droiden</a>
      <a href="ship.html" class="active" data-i18n="nav_ship">Schiffe / Fahrzeuge</a>
    </nav>
  </div>
  <div class="char-manager">
    <select id="savedCharSelect"></select>
    <button id="btnLoad" data-i18n="btn_load">Laden</button>
    <button id="btnSave" class="accent" data-i18n="btn_save">💾 Speichern</button>
    <button id="btnNew" data-i18n="btn_new">Neu</button>
    <button id="btnDelete" title="Löschen">🗑</button>
    <span class="sep"></span>
    <button id="btnExport" data-i18n="btn_export">⬇ Export</button>
    <button id="btnImport" data-i18n="btn_import">⬆ Import</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <span class="sep"></span>
    <button id="btnPrint" class="accent" data-i18n="btn_print">🖨 Drucken / PDF</button>
    <span class="sep"></span>
    <button id="btnOnline">☁ Online</button>
    <span class="sep"></span>
    <div class="options-wrap">
      <button id="btnOptions" title="Options / Optionen">⚙</button>
      <div id="optionsMenu" class="hidden">
        <div class="opt-title" data-i18n="options">Options</div>
        <div class="opt-section" data-i18n="opt_language">Sprache / Language</div>
        <label class="opt-row"><input type="radio" name="langOpt" value="de"> 🇩🇪 Deutsch</label>
        <label class="opt-row"><input type="radio" name="langOpt" value="en"> 🇺🇸 English</label>
        <div id="legalConfig"></div>
        <div class="opt-section" data-i18n="opt_about">Info</div>
        <button id="btnAbout" class="opt-btn" data-i18n="about_open">ℹ About &amp; Credits</button>
      </div>
    </div>
  </div>
</header>

<nav id="tabs" class="no-print">
  <button data-tab="ship" class="active" data-i18n="tab_ship">Schiff</button>
  <button data-tab="weapons" data-i18n="tab_weapons">Waffen</button>
  <button data-tab="crew" data-i18n="tab_crew">Sensoren &amp; Crew</button>
  <button data-tab="mods" data-i18n="tab_mods">Umbauten</button>
  <button data-tab="shop" data-i18n="tab_shop">Werkstatt</button>
  <button data-tab="sheet" data-i18n="tab_sheet">Schiffsbogen</button>
</nav>

<main id="content" class="no-print">
  <section id="tab-ship" class="tab active"></section>
  <section id="tab-weapons" class="tab"></section>
  <section id="tab-crew" class="tab"></section>
  <section id="tab-mods" class="tab"></section>
  <section id="tab-shop" class="tab"></section>
  <section id="tab-sheet" class="tab"></section>
</main>

<div id="sheet-print"></div>

<footer class="no-print">
  <span data-i18n="footer">Basiert auf „Ship Generator v1-1“ von Chance Gibboney &middot; Star Wars: The Roleplaying Game, 2nd Edition – West End Games D6-System</span><span id="legalLinks"></span>
</footer>

<script src="config.js"></script>
<script src="genshared.js"></script>
<script src="gendata.js"></script>
<script src="shiprules.js"></script>
<script src="pdfdata-craft.js"></script>
<script src="skills-de.js"></script>
<script src="ship.js"></script>
<script src="credits.js"></script>
<script src="qrcode.js"></script>
<script src="online.js"></script>
<script src="legal.js"></script>
</body>
</html>
